
services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: lexia-postgres
    environment:
      POSTGRES_USER: lexia_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: lexia_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexia_user -d lexia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexia-network
    restart: unless-stopped

  # ==================== Ollama (LLM Local) ====================
  ollama:
    image: ollama/ollama:latest
    container_name: lexia-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "true", "||", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lexia-network
    restart: unless-stopped
    # Pour démarrer avec des modèles pré-chargés:
    # Décommenter et adapter selon vos besoins
    # entrypoint: >
    #   sh -c "ollama serve &
    #   echo 'Attendez 15 secondes pour Ollama...';
    #   sleep 15;
    #   ollama pull mistral &&
    #   ollama pull nomic-embed-text &&
    #   wait"

  # ==================== Qdrant (Vector Store) ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexia-qdrant
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-your-api-key-change-me}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_config.yml:/qdrant/config/production.yml:ro
    healthcheck:
      test: ["CMD", "true", "||", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lexia-network
    restart: unless-stopped

  # ==================== FastAPI Backend ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexia-backend
    environment:
      # FastAPI
      DEBUG: ${DEBUG:-false}
      PORT: 8080

      # PostgreSQL
      DATABASE_URL: postgresql://lexia_user:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/lexia_db

      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-mistral}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-lexia_chunks}
      QDRANT_USE_MEMORY: ${QDRANT_USE_MEMORY:-false}

      # RAG Configuration
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      MAX_CHUNKS_PER_SEARCH: ${MAX_CHUNKS_PER_SEARCH:-10}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}

      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      # Mount du code pour développement (décommenter si needed)
      # - ./app:/app

      # Logs
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "true", "||", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - lexia-network

    restart: unless-stopped

    # Limiter les ressources
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ==================== Redis (Cache Optional) ====================
  # Décommenter pour ajouter un cache Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: lexia-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - lexia-network
  #   restart: unless-stopped

  # ==================== PgAdmin (Gestion DB - Optionnel) ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lexia-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lexia.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - lexia-network
    restart: unless-stopped
    # Accès: http://localhost:5050/pgadmin

  # ==================== Nginx (Reverse Proxy - Optionnel) ====================
  # Décommenter pour ajouter un reverse proxy Nginx
  # nginx:
  #   image: nginx:alpine
  #   container_name: lexia-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - lexia-network
  #   restart: unless-stopped

networks:
  lexia-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  qdrant_data:
    driver: local
  # redis_data:
  #   driver: local
